<!DOCTYPE html>
<html>
<head>
    <title>Zak Store</title>
    <link rel="stylesheet" href="css/firstpage.css">
</head>
<body>

<header>
    <h1>Zak Store</h1>
</header>

<section class="categories">

    <div class="category-card" data-category="Appliance">
    <img src="images/appliances.jpg" alt="Appliance">
    <h3>Appliance</h3>
</div>

<div class="category-card" data-category="Mobiles">
    <img src="images/mobile.png" alt="Mobiles">
    <h3>Mobile</h3>
</div>

<div class="category-card" data-category="Laptops">
    <img src="images/laptop.png" alt="Laptops">
    <h3>Laptop</h3>
</div>

<div class="category-card" data-category="Televisions">
    <img src="images/tv.jpg" alt="Televisions">
    <h3>TV</h3>
</div>

<div class="category-card" data-category="Watches">
    <img src="images/watch.webp" alt="Watchs">
    <h3>Watch</h3>
</div>

<div class="category-card" data-category="Headphones">
    <img src="images/headphone.webp" alt="Headphones">
    <h3>Headphone</h3>
</div>

<div class="category-card" data-category="Shoes">
    <img src="images/shoe.jpeg" alt="Shoes">
    <h3>Shoe</h3>
</div>

<div class="category-card" data-category="Furniture">
    <img src="images/furnitures.webp" alt="Furniture">
    <h3>Furniture</h3>
</div>

<div class="category-card" data-category="Book">
    <img src="images/books.jpg" alt="Book">
    <h3>Book</h3>
</div>

<div class="category-card" data-category="cosmetics">
    <img src="images/cosmetics.webp" alt="cosmetics">
    <h3>Cosmetics</h3>
</div>

<div class="category-card" data-category="Grocery">
    <img src="images/grocery.png" alt="Grocery">
    <h3>Grocery</h3>
</div>

</section>

<script src="js/firstpage.js"></script>
</body>
</html>
